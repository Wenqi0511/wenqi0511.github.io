<style>
  /* 中英切换核心 CSS：中文模式隐藏英文，英文模式隐藏中文 */
  body.zh .lang-en { display: none !important; }
  body:not(.zh) .lang-zh { display: none !important; }
  #lang-toggle a { cursor: pointer; font-weight: 600; white-space: nowrap; }
</style>

<script>
(function () {
  var KEY = 'site-lang';
  function apply(lang) {
    if (lang === 'zh') {
      document.body.classList.add('zh');
    } else {
      document.body.classList.remove('zh');
    }
    document.documentElement.lang = (lang === 'zh') ? 'zh-CN' : 'en';
    var btn = document.getElementById('lang-toggle');
    if (btn) {
      var a = btn.querySelector('a');
      if (a) { a.textContent = (lang === 'zh') ? 'English' : '中文'; }
    }
  }
  function init() {
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    apply(saved === 'zh' ? 'zh' : 'en');
    var btn = document.getElementById('lang-toggle');
    if (!btn) { return; }
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      var next = document.body.classList.contains('zh') ? 'en' : 'zh';
      try { localStorage.setItem(KEY, next); } catch (e) {}
      apply(next);
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
<!-- 中文字体：Google Fonts（按需加载，不拖慢速度） -->

<style>
  /* 仅中文模式下生效，英文页面保持原样 */
  body.zh {
    font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  body.zh h1, body.zh h2, body.zh h3, body.zh h4, body.zh h5, body.zh h6,
  body.zh .page__title, body.zh .author__name {
    font-family: 'Noto Serif SC', 'Songti SC', 'STSong', serif;
  }
</style>

<!-- end custom head snippets -->
<script>
(function () {
  /* 导航标签翻译字典：网址 → [英文, 中文] */
  var NAV = {
    '/publications/': ['Academic Experience', '学术经历'],
    '/talks/':        ['Internship Experience', '实习经历'],
    '/portfolio/':    ['Portfolio', '作品集'],
    '/year-archive/': ['Reading & Music', '阅读与音乐'],
    '/cv/':           ['CV', '简历']
  };
  /* 页面大标题翻译字典：网址 → [英文, 中文] */
  var TITLES = {
    '/publications/': ['Academic experience', '学术经历'],
    '/talks/':        ['Internship Experience', '实习经历'],
    '/portfolio/':    ['Portfolio', '作品集'],
    '/year-archive/': ['Reading & Music', '阅读与音乐'],
    '/cv/':           ['CV', '简历']
  };
  function norm(p) {
    if (!p) return '';
    p = p.replace(/^https?:\/\/[^\/]+/, '');
    if (p.charAt(0) !== '/') p = '/' + p;
    if (p.charAt(p.length - 1) !== '/') p += '/';
    return p;
  }
  function here() {
    var p = location.pathname;
    if (p.charAt(p.length - 1) !== '/') p += '/';
    return p;
  }
  function apply() {
    var zh = document.body.classList.contains('zh');
    var links = document.querySelectorAll('.greedy-nav a');
    for (var i = 0; i < links.length; i++) {
      var pair = NAV[norm(links[i].getAttribute('href'))];
      if (pair) links[i].textContent = zh ? pair[1] : pair[0];
    }
    var t = TITLES[here()];
    if (t) {
      var h1 = document.querySelector('.page__title');
      if (h1) {
        var set = false;
        for (var j = 0; j < h1.childNodes.length; j++) {
          var n = h1.childNodes[j];
          if (n.nodeType === 3 && n.textContent.trim()) {
            n.textContent = (zh ? t[1] : t[0]);
            set = true;
            break;
          }
        }
        if (!set) h1.insertBefore(document.createTextNode(zh ? t[1] : t[0]), h1.firstChild);
      }
      document.title = (zh ? t[1] : t[0]) + ' · Zhao Wenqi';
    }
  }
  /* 必须等 body 存在之后再监听，否则在 head 里执行会报错 */
  function boot() {
    new MutationObserver(apply).observe(document.body, { attributes: true, attributeFilter: ['class'] });
    apply();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
