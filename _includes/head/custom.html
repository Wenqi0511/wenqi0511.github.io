<style>
  /* ---------- 1. 中英切换核心 ---------- */
  body.zh .lang-en { display: none !important; }
  body:not(.zh) .lang-zh { display: none !important; }
  #lang-toggle a { cursor: pointer; font-weight: 600; white-space: nowrap; }

  /* ---------- 2. 中文模式：思源宋体放第一位 ---------- */
  body.zh,
  body.zh .masthead,
  body.zh .greedy-nav,
  body.zh .greedy-nav a,
  body.zh .masthead__menu-item,
  body.zh .page__title,
  body.zh .author__name,
  body.zh .author__bio,
  body.zh .author__urls,
  body.zh h1, body.zh h2, body.zh h3,
  body.zh h4, body.zh h5, body.zh h6,
  body.zh p, body.zh li, body.zh div, body.zh span,
  body.zh a, body.zh summary, body.zh em,
  body.zh b, body.zh strong, body.zh button {
    font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif !important;
  }
  body.zh b, body.zh strong { font-weight: 700; }

  /* ---------- 3. 排版：字号 / 行距 / 字距（已调小） ---------- */
  body.zh { font-size: 96%; letter-spacing: 0.01em; }
  body.zh .page__content p,
  body.zh .page__content li,
  body.zh .archive p,
  body.zh .archive li { line-height: 1.72; }

  body.zh .page__title {
    font-weight: 700; font-size: 1.45em; letter-spacing: 0.05em;
  }
  body.zh .page__content h2,
  body.zh .archive h2 {
    font-weight: 700; font-size: 1.28em; letter-spacing: 0.02em;
    margin-top: 1.5em; margin-bottom: .45em;
  }
  body.zh .page__content h3,
  body.zh .archive h3 {
    font-weight: 700; font-size: 1.06em; letter-spacing: 0.02em;
    margin-top: 1.3em; margin-bottom: .35em;
  }
  body.zh .greedy-nav a { font-size: 0.9em; letter-spacing: 0.04em; }
  body.zh .author__name { font-weight: 700; font-size: 1em; letter-spacing: 0.04em; }
  body.zh .author__bio  { line-height: 1.7; font-size: 0.86em; }
  body.zh .author__urls li { line-height: 1.68; }
  body.zh summary { line-height: 1.7; }
</style>

<script>
(function () {
  var KEY = 'site-lang';
  function apply(lang) {
    if (lang === 'zh') { document.body.classList.add('zh'); }
    else { document.body.classList.remove('zh'); }
    document.documentElement.lang = (lang === 'zh') ? 'zh-CN' : 'en';
    var btn = document.getElementById('lang-toggle');
    if (btn) {
      var a = btn.querySelector('a');
      if (a) { a.textContent = (lang === 'zh') ? 'English' : '中文'; }
    }
  }
  function init() {
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    apply(saved === 'zh' ? 'zh' : 'en');
    var btn = document.getElementById('lang-toggle');
    if (!btn) { return; }
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      var next = document.body.classList.contains('zh') ? 'en' : 'zh';
      try { localStorage.setItem(KEY, next); } catch (e) {}
      apply(next);
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
})();
</script>

<script>
(function () {
  var NAV = {
    '/publications/': ['Academic Experience', '学术经历'],
    '/talks/':        ['Internship Experience', '实习经历'],
    '/portfolio/':    ['Portfolio', '作品集'],
    '/year-archive/': ['Reading & Music', '阅读与音乐'],
    '/cv/':           ['CV', '简历']
  };
  var TITLES = {
    '/publications/': ['Academic experience', '学术经历'],
    '/talks/':        ['Internship Experience', '实习经历'],
    '/portfolio/':    ['Portfolio', '作品集'],
    '/year-archive/': ['Reading & Music', '阅读与音乐'],
    '/cv/':           ['CV', '简历']
  };
  function norm(p) {
    if (!p) return '';
    p = p.replace(/^https?:\/\/[^\/]+/, '');
    if (p.charAt(0) !== '/') p = '/' + p;
    if (p.charAt(p.length - 1) !== '/') p += '/';
    return p;
  }
  function here() {
    var p = location.pathname;
    if (p.charAt(p.length - 1) !== '/') p += '/';
    return p;
  }
  function apply() {
    var zh = document.body.classList.contains('zh');
    var links = document.querySelectorAll('.greedy-nav a');
    for (var i = 0; i < links.length; i++) {
      var pair = NAV[norm(links[i].getAttribute('href'))];
      if (pair) links[i].textContent = zh ? pair[1] : pair[0];
    }
    var t = TITLES[here()];
    if (t) {
      var h1 = document.querySelector('.page__title');
      if (h1) {
        var set = false;
        for (var j = 0; j < h1.childNodes.length; j++) {
          var n = h1.childNodes[j];
          if (n.nodeType === 3 && n.textContent.trim()) {
            n.textContent = (zh ? t[1] : t[0]); set = true; break;
          }
        }
        if (!set) h1.insertBefore(document.createTextNode(zh ? t[1] : t[0]), h1.firstChild);
      }
      document.title = (zh ? t[1] : t[0]) + ' · Zhao Wenqi';
    }
  }
  function boot() {
    new MutationObserver(apply).observe(document.body, { attributes: true, attributeFilter: ['class'] });
    apply();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else { boot(); }
})();
</script>
